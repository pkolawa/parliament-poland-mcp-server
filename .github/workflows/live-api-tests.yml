name: live-api-tests

# Daily health check of the Sejm API against the tools on main. Unlike the live-api
# job on pull requests, this workflow fails when the API is down or has changed.

on:
  schedule:
    # GitHub Actions cron is in UTC.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sejm-api-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live API tests
        run: npm run test:live-api -- --json --outputFile="$RUNNER_TEMP/live-api-results.json"

      - name: Report results
        if: always()
        run: node scripts/live-api-summary.mjs "$RUNNER_TEMP/live-api-results.json"
